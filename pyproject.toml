[project]
name = "ctail"
version = "0.1.3"
description = "Tail log output with configurable, fine-grained terminal colors"
readme = "README.md"
authors = [
    { name = "dsavkovic", email = "dejan.savkovic@aviatnet.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=13.7",
    "tomlkit>=0.13",
]

[project.scripts]
ctail = "ctail.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["config/**/*.toml"]
data = { purelib = "config" }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TRY004"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
