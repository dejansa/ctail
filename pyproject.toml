[project]
name = "ctail"
version = "0.1.0"
description = "Tail log output with configurable, fine-grained terminal colors"
readme = "README.md"
authors = [
    { name = "dsavkovic", email = "dejan.savkovic@aviatnet.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=13.7",
]

[project.scripts]
ctail = "ctail:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
