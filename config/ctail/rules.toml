# Ad-hoc literal matches created while ctail is running.
# Edit or remove entries here; these are separate from ctail.toml.

[[rules]]
name = "Request ID field"
pattern = "request_id="
color = "bright_cyan"
regex = false

[[rules]]
name = "Cache misses"
pattern = '(?i)\bcache[- ]miss(?:es)?\b'
color = "orange3"
regex = true
