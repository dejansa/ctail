show_unmatched = true


[[rules]]
name = "Syslog timestamp"
pattern = '\w{3} \d{2} \d{2}:\d{2}:\d{2}'
color = "bright_black"

[[rules]]
name = "ISO timestamp"
pattern = '\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
color = "bright_black"

[[rules]]
name = "Info level"
pattern = '(?i)\[(?:info)\]'
color = "bold blue"

[[rules]]
name = "Error and fatal levels"
pattern = '(?i)\[(?:error|fatal)\].*?'
color = "bold bright_red"

[[rules]]
name = "Warning level"
pattern = '(?i)\[(?:warn|warning)\]'
color = "bold magenta"

[[rules]]
name = "Debug level"
pattern = '(?i)\[debug\]'
color = "bright_black"
