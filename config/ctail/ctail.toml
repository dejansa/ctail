show_unmatched = true

# Automatically select an existing profile for matching files.
# Mappings are checked in order; the first match wins.
# [[profile_paths]]
# profile = "http-access"
# paths = ["~/logs/http/", "/var/log/nginx/*.log"]


[[rules]]
name = "Syslog timestamp"
pattern = '\w{3} \d{2} \d{2}:\d{2}:\d{2}'
color = "bright_black"

[[rules]]
name = "ISO timestamp"
pattern = '\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
color = "bright_black"

[[rules]]
name = "HTTP status and message"
pattern = '(status=)(\d{3}).*'
color = "bright_cyan, bold bright_red, bright_black"

[[rules]]
name = "Info level"
pattern = '(?i)\[(?:info)\]'
color = "bold blue"

[[rules]]
name = "Error and fatal levels"
pattern = '(?i)\[(?:error|fatal)\].*?'
color = "bold bright_red"

[[rules]]
name = "Warning level"
pattern = '(?i)\[(?:warn|warning)\]'
color = "bold magenta"

[[rules]]
name = "Debug level"
pattern = '(?i)\[debug\]'
color = "bright_black"

[profiles.http-access]

[[profiles.http-access.rules]]
name = "HTTP request method"
pattern = '\b(?:GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\b'
color = "bright_cyan"
